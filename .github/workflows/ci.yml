# =============================================================================
# .github/workflows/ci.yml - CI/CD & Release Pipeline for FreeBSD usr.bin
#
# 1. qa: Ruff, Interrogate (100% doc), Mypy (--strict), Pytest (100% branch
#    coverage), Pre-Commit, and upstream freebsd-src cleanliness verification.
# 2. build-windows: Matrix build across X64, X86, and ARM64 with MSVC + Ninja,
#    Section 3 SHARED DLLs, standalone per-binary CMakeLists.txt verification,
#    CTest suite (X64 & X86), and CPack (ZIP, NSIS, WiX).
# 3. build-linux-wine: Unix CMake + Section 3 SHARED libs + CTest verification.
# 4. build-dos: OpenWatcom v2 32-bit Protected-Mode DOS build (Section 3 STATIC
#    .lib + per-binary .exe + freebsd-usr-bin.exe) and CPack ZIP packaging.
# 5. test-msdos: Headless QEMU + OpenWatcom v2 MS-DOS (4.00, 2.00, 1.25; I86 +
#    I386) build and CTest verification of the current working directory via c-ci.
# 6. release: On v* tags, runs scripts.package_release_assets to assemble suite
#    bundles, Section 3 SDK, <prog>-<ver>-windows.zip, <prog>-<ver>-dos32.zip,
#    and SHA256SUMS.txt (< 950 assets), publishing to GitHub Releases.
# =============================================================================

name: CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  msdos_testing: true

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout freebsd-usr-bin-windows
        uses: actions/checkout@v7

      - name: Checkout auto-win-msvc
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/auto-win-msvc
          ref: master
          path: auto-win-msvc

      - name: Sparse Checkout freebsd-src
        uses: actions/checkout@v7
        with:
          repository: freebsd/freebsd-src
          ref: releng/15.0
          path: freebsd-src
          fetch-depth: 1
          sparse-checkout: |
            bin
            contrib
            gnu
            include
            lib
            libexec
            sys
            usr.bin
            usr.sbin

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python QA & Coverage Tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov mypy ruff interrogate pre-commit

      - name: Run Lint, 100% Doc/Branch Coverage, Strict Typing & Pre-Commit
        run: |
          ruff check scripts tests
          ruff format --check scripts tests
          interrogate --fail-under=100 -vv scripts tests
          mypy --strict scripts tests
          pytest --cov=scripts --cov=tests --cov-branch --cov-fail-under=100
          pre-commit run --all-files
          test -f auto-win-msvc/bsd-dev-headers/include/elf.h
          test -z "$(git -C freebsd-src status --porcelain)"

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: X64
            msvc_arch: amd64
            run_tests: true
            build_nsis: true
          - arch: X86
            msvc_arch: amd64_x86
            run_tests: true
            build_nsis: true
          - arch: ARM64
            msvc_arch: amd64_arm64
            run_tests: false
            build_nsis: false
    steps:
      - name: Checkout freebsd-usr-bin-windows
        uses: actions/checkout@v7

      - name: Checkout auto-win-msvc
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/auto-win-msvc
          ref: master
          path: auto-win-msvc

      - name: Sparse Checkout freebsd-src
        uses: actions/checkout@v7
        with:
          repository: freebsd/freebsd-src
          ref: releng/15.0
          path: freebsd-src
          fetch-depth: 1
          sparse-checkout: |
            bin
            contrib
            gnu
            include
            lib
            libexec
            sys
            usr.bin
            usr.sbin

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build Host x64 Berkeley byacc & Setup m4 / win_flex
        shell: pwsh
        run: |
          $hostTools = Join-Path $env:RUNNER_TEMP "fbsd_host_tools"
          New-Item -ItemType Directory -Force -Path $hostTools | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars64 = Join-Path $vcInstall "VC\Auxiliary\Build\vcvars64.bat"
          $byaccDir = Join-Path $PWD "freebsd-src\contrib\byacc"
          $byaccExe = Join-Path $hostTools "byacc.exe"
          $byaccSrcs = @(
            "closure.c", "error.c", "graph.c", "lalr.c", "lr0.c", "main.c", "mkpar.c",
            "mstring.c", "output.c", "reader.c", "yaccpar.c", "symtab.c", "verbose.c", "warshall.c"
          ) | ForEach-Object { "`"$(Join-Path $byaccDir $_)`"" }
          $srcArgs = $byaccSrcs -join " "
          cmd /c "`"$vcvars64`" >nul && pushd `"$hostTools`" && cl.exe /nologo /O2 /D_CRT_SECURE_NO_WARNINGS /D_CRT_NONSTDC_NO_DEPRECATE /DMAXTABLE=INT_MAX /DYYPATCH=20230201 -I`"$byaccDir`" $srcArgs /Fe:`"$byaccExe`""
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $byaccExe)) {
            throw "Failed to compile host x64 byacc.exe ($LASTEXITCODE)"
          }
          echo "$hostTools" >> $env:GITHUB_PATH
          $env:PATH = "$hostTools;$env:PATH"
          if (-not (Get-Command win_flex.exe -ErrorAction SilentlyContinue) -and -not (Get-Command flex.exe -ErrorAction SilentlyContinue)) {
            choco install winflexbison3 -y --no-progress
          }
          $chocoBin = "C:\ProgramData\chocolatey\bin"
          if (Test-Path $chocoBin) {
            echo "$chocoBin" >> $env:GITHUB_PATH
            $env:PATH = "$chocoBin;$env:PATH"
          }
          $m4Cmd = Get-Command m4.exe -ErrorAction SilentlyContinue
          $m4Path = if ($m4Cmd) {
            $m4Cmd.Source
          } elseif (Test-Path "C:\msys64\usr\bin\m4.exe") {
            "C:\msys64\usr\bin\m4.exe"
          } elseif (Test-Path "C:\Program Files\Git\usr\bin\m4.exe") {
            "C:\Program Files\Git\usr\bin\m4.exe"
          } else {
            choco install m4 -y --no-progress
            (Get-Command m4.exe -ErrorAction Stop).Source
          }
          $lexCmd = Get-Command win_flex.exe, flex.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $lexCmd) { throw "Host flex/lex binary not found" }
          Write-Host "Using byacc: $byaccExe"
          Write-Host "Using m4: $m4Path"
          & $byaccExe -V
          & $lexCmd.Source --version | Select-Object -First 1

      - name: Setup MSVC (${{ matrix.arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Configure & Build Full Suite + Section 3 DLLs (${{ matrix.arch }})
        shell: cmd
        run: |
          cmake -G Ninja -B build -S . -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_SOURCE_DIR_AUTO_WIN_MSVC="%CD%/auto-win-msvc" -DFREEBSD_SRC_DIR="%CD%/freebsd-src"
          cmake --build build --parallel

      - name: Verify Standalone Per-Binary CMakeLists.txt (${{ matrix.arch }})
        shell: cmd
        run: |
          cmake -G Ninja -S build/freebsd_generated/per_binary/printf -B build_standalone_printf -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_SOURCE_DIR_AUTO_WIN_MSVC="%CD%/auto-win-msvc" -DFREEBSD_SRC_DIR="%CD%/freebsd-src"
          cmake --build build_standalone_printf --parallel
          cmake -G Ninja -S build/freebsd_generated/per_binary/bzip2 -B build_standalone_bzip2 -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_SOURCE_DIR_AUTO_WIN_MSVC="%CD%/auto-win-msvc" -DFREEBSD_SRC_DIR="%CD%/freebsd-src"
          cmake --build build_standalone_bzip2 --parallel

      - name: Run CTest Functional Suite (${{ matrix.arch }})
        if: matrix.run_tests
        shell: cmd
        run: |
          ctest --test-dir build --output-on-failure
          build\bin\freebsd-usr-bin.exe --version
          build\bin\printf.exe "win-%s" "${{ matrix.arch }}"

      - name: Verify Upstream freebsd-src Unmodified
        shell: pwsh
        run: |
          $dirty = git -C freebsd-src status --porcelain
          if ($dirty) { throw "freebsd-src was modified: $dirty" }

      - name: Install NSIS
        if: matrix.build_nsis
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          $nsisPath = if (Test-Path "${env:ProgramFiles(x86)}\NSIS") { "${env:ProgramFiles(x86)}\NSIS" } else { "$env:ProgramFiles\NSIS" }
          if (Test-Path "$nsisPath\makensis.exe") {
            echo "$nsisPath" >> $env:GITHUB_PATH
            & "$nsisPath\makensis.exe" /VERSION
          }

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          if (-not ($env:WIX -and (Test-Path "$env:WIX\bin\candle.exe")) -and -not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          }
          $wixBin = if ($env:WIX -and (Test-Path "$env:WIX\bin\candle.exe")) {
            "$env:WIX\bin"
          } else {
            (Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*\bin\candle.exe", "$env:ProgramFiles\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).DirectoryName
          }
          if ($wixBin) {
            echo "$wixBin" >> $env:GITHUB_PATH
          }

      - name: Package Suite Installers with CPack (${{ matrix.arch }})
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/*") {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            "15.0.0"
          }
          $pkgVersion = if ($version -match '^\d+\.\d+\.\d+(\.\d+)?$') { $version } else { "15.0.0" }
          $arch = "${{ matrix.arch }}"
          $fileName = "freebsd-usr-bin-$version-$arch"
          $setupFileName = "freebsd-usr-bin-$version-$arch-setup"
          Push-Location build
          cpack -C Release -G ZIP -D "CPACK_PACKAGE_VERSION=$pkgVersion" -D "CPACK_PACKAGE_FILE_NAME=$fileName"
          if ($LASTEXITCODE -ne 0) { throw "cpack ZIP failed ($LASTEXITCODE)" }
          if ("${{ matrix.build_nsis }}" -eq "true") {
            cpack -C Release -G NSIS -D "CPACK_PACKAGE_VERSION=$pkgVersion" -D "CPACK_PACKAGE_FILE_NAME=$setupFileName"
            if ($LASTEXITCODE -ne 0) { throw "cpack NSIS failed ($LASTEXITCODE)" }
          }
          cpack -C Release -G WIX -D "CPACK_PACKAGE_VERSION=$pkgVersion" -D "CPACK_PACKAGE_FILE_NAME=$fileName"
          if ($LASTEXITCODE -ne 0) { throw "cpack WIX failed ($LASTEXITCODE)" }
          Copy-Item "bin\freebsd-usr-bin.exe" -Destination "$fileName.exe" -Force
          Pop-Location

      - name: Upload Windows ${{ matrix.arch }} Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            build/bin/*
            build/lib/*
            build/freebsd_generated/section3/include/**
            build/freebsd_generated/per_binary/**
            build/freebsd-usr-bin-*-${{ matrix.arch }}*

  build-linux-wine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout freebsd-usr-bin-windows
        uses: actions/checkout@v7

      - name: Checkout auto-win-msvc
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/auto-win-msvc
          ref: master
          path: auto-win-msvc

      - name: Sparse Checkout freebsd-src
        uses: actions/checkout@v7
        with:
          repository: freebsd/freebsd-src
          ref: releng/15.0
          path: freebsd-src
          fetch-depth: 1
          sparse-checkout: |
            bin
            contrib
            gnu
            include
            lib
            libexec
            sys
            usr.bin
            usr.sbin

      - name: Configure, Build & CTest Suite on Linux
        run: |
          cmake -B build_unix -S . -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_SOURCE_DIR_AUTO_WIN_MSVC="$PWD/auto-win-msvc" -DFREEBSD_SRC_DIR="$PWD/freebsd-src"
          cmake --build build_unix --parallel
          ctest --test-dir build_unix --output-on-failure
          test -z "$(git -C freebsd-src status --porcelain)"

  build-dos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout freebsd-usr-bin-windows
        uses: actions/checkout@v7

      - name: Checkout auto-win-msvc
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/auto-win-msvc
          ref: master
          path: auto-win-msvc

      - name: Sparse Checkout freebsd-src
        uses: actions/checkout@v7
        with:
          repository: freebsd/freebsd-src
          ref: releng/15.0
          path: freebsd-src
          fetch-depth: 1
          sparse-checkout: |
            bin
            contrib
            gnu
            include
            lib
            libexec
            sys
            usr.bin
            usr.sbin

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install OpenWatcom v2 Toolchain
        run: |
          sudo mkdir -p /opt/watcom
          sudo chown -R "$USER:$USER" /opt/watcom
          curl -fL --retry 3 -o /tmp/ow-snapshot.tar.xz https://github.com/open-watcom/open-watcom-v2/releases/download/Current-build/ow-snapshot.tar.xz
          tar -xJf /tmp/ow-snapshot.tar.xz -C /opt/watcom
          rm -f /tmp/ow-snapshot.tar.xz

      - name: Configure, Build & Package 32-bit DOS Suite with OpenWatcom v2
        run: |
          export WATCOM="/opt/watcom"
          if [ -d "$WATCOM/binl64" ]; then
            WATCOM_BIN="$WATCOM/binl64"
          else
            WATCOM_BIN="$WATCOM/binl"
          fi
          export PATH="$WATCOM_BIN:$WATCOM/binw:$PATH"
          export INCLUDE="$WATCOM/h"
          export EDPATH="$WATCOM/eddat"
          export WIPFC="$WATCOM/wipfc"

          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) VER="15.0.0" ;;
          esac

          cmake -G "Watcom WMake" -B build_dos -S . -DCMAKE_SYSTEM_NAME=DOS -DCMAKE_SYSTEM_PROCESSOR=I386 -DCMAKE_C_COMPILER="$WATCOM_BIN/wcl386" -DCMAKE_C_FLAGS_INIT="-bt=dos -mf -3r -zq" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DFETCHCONTENT_SOURCE_DIR_AUTO_WIN_MSVC="$PWD/auto-win-msvc" -DFREEBSD_SRC_DIR="$PWD/freebsd-src"

          cmake --build build_dos --config Release

          if [ -f "$WATCOM/binw/dos32a.exe" ]; then
            cp "$WATCOM/binw/dos32a.exe" build_dos/DOS32A.EXE
          fi
          (
            cd build_dos
            cpack -C Release -G ZIP -D "CPACK_PACKAGE_VERSION=$VER" -D "CPACK_PACKAGE_FILE_NAME=freebsd-usr-bin-$VER-dos32"
            if [ -f bin/freebsd-usr-bin.exe ]; then
              cp bin/freebsd-usr-bin.exe "freebsd-usr-bin-$VER-dos32.exe"
            elif [ -f freebsd-usr-bin.exe ]; then
              cp freebsd-usr-bin.exe "freebsd-usr-bin-$VER-dos32.exe"
            fi
          )
          test -z "$(git -C freebsd-src status --porcelain)"

      - name: Upload 32-bit DOS Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dos32
          path: |
            build_dos/bin/*
            build_dos/lib/*
            build_dos/DOS32A.EXE
            build_dos/freebsd-usr-bin-*-dos32*

  test-msdos:
    name: ${{ matrix.label }} (${{ matrix.archs }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_target: msdos-4.0
            label: MS-DOS 4.00
            archs: I86,I386
          - os_target: msdos-2.0
            label: MS-DOS 2.00
            archs: I86,I386
          - os_target: msdos-1.25
            label: MS-DOS 1.25
            archs: I86,I386
    steps:
      - name: Checkout freebsd-usr-bin-windows
        uses: actions/checkout@v7

      - name: Checkout auto-win-msvc
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/auto-win-msvc
          ref: master
          path: auto-win-msvc

      - name: Sparse Checkout freebsd-src
        uses: actions/checkout@v7
        with:
          repository: freebsd/freebsd-src
          ref: releng/15.0
          path: freebsd-src
          fetch-depth: 1
          sparse-checkout: |
            bin
            contrib
            gnu
            include
            lib
            libexec
            sys
            usr.bin
            usr.sbin

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Stage c-ci and Bento Repositories
        shell: bash
        run: |
          set -e
          rm -rf "$RUNNER_TEMP/c-ci" "$RUNNER_TEMP/bento"
          git clone --depth 1 --branch master https://github.com/SamuelMarks/c-ci.git "$RUNNER_TEMP/c-ci"

          cloned_bento=0
          for ref_cand in "multi-os-qemu-aarch64" "dos" "main"; do
            if git clone --depth 1 --branch "$ref_cand" https://github.com/SamuelMarks/bento.git "$RUNNER_TEMP/bento" 2>/dev/null; then
              if [ -f "$RUNNER_TEMP/bento/msdos-builder.sh" ]; then
                cloned_bento=1
                break
              fi
              rm -rf "$RUNNER_TEMP/bento"
            fi
          done
          if [ "$cloned_bento" -ne 1 ]; then
            echo "Error: Failed to locate msdos-builder.sh in SamuelMarks/bento" >&2
            exit 1
          fi

          bento_sha="$(git -C "$RUNNER_TEMP/bento" rev-parse HEAD)"
          echo "BENTO_HEAD_SHA=${bento_sha}" >> "$GITHUB_ENV"

      - name: Install Host Dependencies (QEMU, mtools, NASM, Ruby, CMake)
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            mtools \
            dosfstools \
            nasm \
            unzip \
            xz-utils \
            ruby \
            cmake \
            m4 \
            byacc \
            flex \
            curl \
            ca-certificates

      - name: Cache OpenWatcom v2 Toolchain
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/watcom-cache
          key: c-ci-openwatcom-v2-${{ runner.os }}-${{ runner.arch }}

      - name: Cache Bento DOS Base Images & Compiled Stages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/bento/builds
          key: c-ci-bento-dos-v2-${{ env.BENTO_HEAD_SHA }}-${{ matrix.os_target }}
          restore-keys: |
            c-ci-bento-dos-v2-${{ env.BENTO_HEAD_SHA }}-

      - name: Build and Run CTest on ${{ matrix.label }} (${{ matrix.archs }})
        shell: bash
        env:
          DOS_WATCOM_ROOT: ${{ runner.temp }}/watcom-cache
          DOS_WORK_DIR: ${{ runner.temp }}/dos-work
          DOS_BUILD_TYPE: Release
        run: |
          set -e
          sh "$RUNNER_TEMP/c-ci/run_dos_watcom_matrix.sh" \
            --mode standalone \
            --os "${{ matrix.os_target }}" \
            --arch "${{ matrix.archs }}" \
            --bento-dir "$RUNNER_TEMP/bento" \
            --project "."
          test -z "$(git -C freebsd-src status --porcelain)"

  release:
    runs-on: ubuntu-latest
    needs:
      - qa
      - build-windows
      - build-linux-wine
      - build-dos
      - test-msdos
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout freebsd-usr-bin-windows
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble Suite, Section 3 SDK, Per-Binary & Checksum Release Assets
        run: |
          VER="${GITHUB_REF_NAME#v}"
          python -m scripts.package_release_assets --version "$VER" --repo-root "$PWD" --output-dir "$PWD/release_assets" --win-x64 "$PWD/artifacts/windows-X64" --win-x86 "$PWD/artifacts/windows-X86" --win-arm64 "$PWD/artifacts/windows-ARM64" --dos-dir "$PWD/artifacts/dos32" --per-binary-cmake-dir "$PWD/artifacts/windows-X64/freebsd_generated/per_binary"

      - name: Publish Assets to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: release_assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
